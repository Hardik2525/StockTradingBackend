spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # routes
        - id: user-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/register , /api/v1/users/login

          #USER SERVICE
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthFilter

          #MARKET DATA SERVICE
        - id: market-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/market-data/**
          filters:
            - JwtAuthFilter

          #ORDER SERVICE
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - JwtAuthFilter

          #WEBSOCKET SERVICE
        - id: market-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

          #PORTFOLIO SERVICE
        - id: portfolio-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - JwtAuthFilter

server:
  port: 8080

jwt:
  secret: XwrVWyTiZ2dZyxwS4TJudqGfxpCOrJdgMNK62bC+sTY=

management:
